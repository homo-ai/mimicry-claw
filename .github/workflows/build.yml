name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAR: build/libs/mimicry-claw-1.0.0.jar

jobs:
  build-jar:
    name: Build, test and verify the runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin
        run: gradle --no-daemon --stacktrace compileKotlin

      - name: Run tests
        run: gradle --no-daemon --stacktrace test

      - name: Build fat JAR
        run: gradle --no-daemon --stacktrace fatJar

      - name: Verify JAR (help)
        run: |
          ls -lh build/libs/
          java -jar "$JAR" --help

      - name: Verify JAR (CLI surface)
        run: |
          set -euo pipefail
          java -jar "$JAR" --version
          java -jar "$JAR" tools
          java -jar "$JAR" providers
          java -jar "$JAR" status --json
          java -jar "$JAR" sessions --json

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mimicry-claw-jar
          path: build/libs/mimicry-claw-1.0.0.jar
          if-no-files-found: error

  package:
    name: Package ${{ matrix.target }}
    needs: build-jar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            label: Windows x64
            launcher: run.bat
            requirements: Java 21 JDK for Windows (https://adoptium.net/)
            usage: double-click run.bat
          - target: windows-arm64
            label: Windows ARM64
            launcher: run.bat
            requirements: Java 21 JDK for Windows ARM64 (https://adoptium.net/)
            usage: double-click run.bat
          - target: linux-x64
            label: Linux x64
            launcher: run.sh
            requirements: Java 21 JDK (sudo apt install openjdk-21-jdk)
            usage: ./run.sh
          - target: linux-arm64
            label: Linux ARM64
            launcher: run.sh
            requirements: Java 21 JDK for ARM64 (sudo apt install openjdk-21-jdk)
            usage: ./run.sh
          - target: macos-x64
            label: macOS Intel
            launcher: run.sh
            requirements: Java 21 JDK (brew install openjdk@21)
            usage: ./run.sh
          - target: macos-arm64
            label: macOS Apple Silicon
            launcher: run.sh
            requirements: Java 21 JDK (brew install openjdk@21)
            usage: ./run.sh
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: mimicry-claw-jar
          path: build/libs/

      - name: Assemble package
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          LAUNCHER: ${{ matrix.launcher }}
          REQUIREMENTS: ${{ matrix.requirements }}
          USAGE: ${{ matrix.usage }}
        run: |
          set -euo pipefail
          dir="pkg-${TARGET}"
          mkdir -p "$dir"
          cp "$JAR" "$dir/"

          if [ "$LAUNCHER" = "run.bat" ]; then
            printf '%s\r\n' \
              '@echo off' \
              'where java.exe >nul 2>&1' \
              'if %ERRORLEVEL% NEQ 0 (' \
              '  echo Java 21 is required. Get it from https://adoptium.net/' \
              '  exit /b 1' \
              ')' \
              'java -jar "%~dp0mimicry-claw-1.0.0.jar" %*' > "$dir/run.bat"
          else
            printf '%s\n' \
              '#!/bin/sh' \
              'if ! command -v java >/dev/null 2>&1; then' \
              '  echo "Java 21 is required. Install it, then run this script again."' \
              '  exit 1' \
              'fi' \
              'exec java -jar "$(dirname "$0")/mimicry-claw-1.0.0.jar" "$@"' > "$dir/run.sh"
            chmod +x "$dir/run.sh"
          fi

          printf '%s\n' \
            "Mimicry Claw - ${LABEL}" \
            '=========================' \
            "Requirements: ${REQUIREMENTS}" \
            "Run: ${USAGE}" \
            '' \
            'Commands:' \
            '  run --help                 Show all commands' \
            '  run tui                    Interactive TUI' \
            '  run exec "your prompt"     One-shot task' \
            '  run serve                  Start the local runtime (HTTP + SSE)' \
            '  run status                 Show runtime status' \
            > "$dir/README.txt"

          cd "$dir"
          zip -r "../mimicry-claw-${TARGET}.zip" .
          cd ..
          ls -lh "mimicry-claw-${TARGET}.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mimicry-claw-${{ matrix.target }}
          path: mimicry-claw-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish v1.0.0
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Write release notes
        run: |
          cat > release_notes.md << 'NOTES_EOF'
          ## Mimicry Claw v1.0.0

          ### Requirements
          - **Java 21 JDK** on every platform
          - Download: https://adoptium.net/ (or `brew install openjdk@21` on macOS)

          ### Usage
          Extract the ZIP for your platform and run `run.bat` (Windows) or `./run.sh` (Linux/macOS).

          ```
          run --help                 Show all commands
          run tui                    Interactive TUI (Normal / Full Screen)
          run exec "your prompt"     One-shot task
          run serve                  Start the local runtime (HTTP + SSE)
          run status                 Show runtime status
          ```

          ### API configuration
          Set the provider API key before running, for example:
          ```
          export ANTHROPIC_API_KEY="sk-ant-..."
          export OPENAI_API_KEY="sk-..."
          ```

          ### Artifacts
          - `mimicry-claw-windows-x64.zip`
          - `mimicry-claw-windows-arm64.zip`
          - `mimicry-claw-linux-x64.zip`
          - `mimicry-claw-linux-arm64.zip`
          - `mimicry-claw-macos-x64.zip`
          - `mimicry-claw-macos-arm64.zip`
          NOTES_EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 \
            --title "Mimicry Claw v1.0.0" \
            --notes-file release_notes.md \
            --latest \
            artifacts/mimicry-claw-windows-x64/mimicry-claw-windows-x64.zip \
            artifacts/mimicry-claw-windows-arm64/mimicry-claw-windows-arm64.zip \
            artifacts/mimicry-claw-linux-x64/mimicry-claw-linux-x64.zip \
            artifacts/mimicry-claw-linux-arm64/mimicry-claw-linux-arm64.zip \
            artifacts/mimicry-claw-macos-x64/mimicry-claw-macos-x64.zip \
            artifacts/mimicry-claw-macos-arm64/mimicry-claw-macos-arm64.zip
