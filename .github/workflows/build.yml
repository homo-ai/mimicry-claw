name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAR: build/libs/mimicry-claw-1.0.0.jar

jobs:
  build-jar:
    name: Build, test and verify the runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin
        run: gradle --no-daemon --stacktrace compileKotlin

      - name: Run tests
        run: gradle --no-daemon --stacktrace test

      - name: Build fat JAR
        run: gradle --no-daemon --stacktrace fatJar

      - name: Verify JAR (help)
        run: |
          ls -lh build/libs/
          java -jar "$JAR" --help

      - name: Verify JAR (CLI surface)
        run: |
          set -euo pipefail
          java -jar "$JAR" --version
          java -jar "$JAR" tools
          java -jar "$JAR" providers
          java -jar "$JAR" status --json
          java -jar "$JAR" sessions --json

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mimicry-claw-jar
          path: build/libs/mimicry-claw-1.0.0.jar
          if-no-files-found: error

  build-gui:
    name: Test desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/download-artifact@v4
        with:
          name: mimicry-claw-jar
          path: build/libs/
      - name: Build GUI
        run: dotnet build gui/Mimicry.Gui/Mimicry.Gui.csproj -c Release
      - name: GUI and protocol tests
        run: dotnet test gui/Mimicry.Gui.Tests/Mimicry.Gui.Tests.csproj -c Release --results-directory gui/Mimicry.Gui.Tests/TestResults --logger "trx;LogFileName=gui-tests.trx"
      - name: Test against the actual Kotlin runtime
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_NOLOGO=1
          home=$(mktemp -d)
          project=$(mktemp -d)
          home_native="$home"
          project_native="$project"
          if [ "$RUNNER_OS" = "Windows" ]; then
            home_native=$(cygpath -w "$home")
            project_native=$(cygpath -w "$project")
          fi
          java -Duser.home="$home_native" -jar "$JAR" serve --cwd "$project_native" > runtime-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            [ -f "$home/.mimicry/runtime.json" ] && break
            kill -0 "$pid" || { cat runtime-smoke.log; exit 1; }
            sleep 0.1
          done
          test -f "$home/.mimicry/runtime.json"
          MIMICRY_TEST_RUNTIME_FILE="$home_native/.mimicry/runtime.json" dotnet test gui/Mimicry.Gui.Tests/Mimicry.Gui.Tests.csproj -c Release --no-build --filter FullyQualifiedName~LiveRuntime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-test-results-${{ matrix.os }}
          path: gui/Mimicry.Gui.Tests/TestResults/
    needs: build-jar

  publish-gui:
    name: Publish desktop ${{ matrix.target }}
    needs: build-gui
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, rid: win-x64}
          - {target: windows-arm64, rid: win-arm64}
          - {target: linux-x64, rid: linux-x64}
          - {target: linux-arm64, rid: linux-arm64}
          - {target: macos-x64, rid: osx-x64}
          - {target: macos-arm64, rid: osx-arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained GUI
        run: dotnet publish gui/Mimicry.Gui/Mimicry.Gui.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -o gui/publish
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: gui/publish/
          if-no-files-found: error

  package:
    name: Package ${{ matrix.target }}
    needs: [build-jar, publish-gui]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            label: Windows x64
            launcher: run.bat
            requirements: Java 21 JDK for Windows (https://adoptium.net/)
            usage: double-click run.bat
          - target: windows-arm64
            label: Windows ARM64
            launcher: run.bat
            requirements: Java 21 JDK for Windows ARM64 (https://adoptium.net/)
            usage: double-click run.bat
          - target: linux-x64
            label: Linux x64
            launcher: run.sh
            requirements: Java 21 JDK (sudo apt install openjdk-21-jdk)
            usage: ./run.sh
          - target: linux-arm64
            label: Linux ARM64
            launcher: run.sh
            requirements: Java 21 JDK for ARM64 (sudo apt install openjdk-21-jdk)
            usage: ./run.sh
          - target: macos-x64
            label: macOS Intel
            launcher: run.sh
            requirements: Java 21 JDK (brew install openjdk@21)
            usage: ./run.sh
          - target: macos-arm64
            label: macOS Apple Silicon
            launcher: run.sh
            requirements: Java 21 JDK (brew install openjdk@21)
            usage: ./run.sh
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: mimicry-claw-jar
          path: build/libs/

      - name: Download desktop frontend
        uses: actions/download-artifact@v4
        with:
          name: gui-${{ matrix.target }}
          path: desktop/

      - name: Assemble package
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ matrix.label }}
          LAUNCHER: ${{ matrix.launcher }}
          REQUIREMENTS: ${{ matrix.requirements }}
          USAGE: ${{ matrix.usage }}
        run: |
          set -euo pipefail
          dir="pkg-${TARGET}"
          mkdir -p "$dir"
          cp "$JAR" "$dir/"
          mkdir -p "$dir/gui"
          cp -R desktop/. "$dir/gui/"
          if [ -f "$dir/gui/Mimicry.Gui" ]; then chmod +x "$dir/gui/Mimicry.Gui"; fi

          if [ "$LAUNCHER" = "run.bat" ]; then
            printf '%s\r\n' \
              '@echo off' \
              'where java.exe >nul 2>&1' \
              'if %ERRORLEVEL% NEQ 0 (' \
              '  echo Java 21 is required. Get it from https://adoptium.net/' \
              '  exit /b 1' \
              ')' \
              'java -jar "%~dp0mimicry-claw-1.0.0.jar" %*' > "$dir/run.bat"
          else
            printf '%s\n' \
              '#!/bin/sh' \
              'if ! command -v java >/dev/null 2>&1; then' \
              '  echo "Java 21 is required. Install it, then run this script again."' \
              '  exit 1' \
              'fi' \
              'exec java -jar "$(dirname "$0")/mimicry-claw-1.0.0.jar" "$@"' > "$dir/run.sh"
            chmod +x "$dir/run.sh"
          fi

          printf '%s\n' \
            "Mimicry Claw - ${LABEL}" \
            '=========================' \
            "Requirements: ${REQUIREMENTS}" \
            "Run: ${USAGE}" \
            '' \
            'Commands:' \
            '  run --help                 Show all commands' \
            '  run tui                    Interactive TUI' \
            '  run gui                    Open desktop GUI (runtime auto-start/attach)' \
            'GUI is self-contained; .NET installation is not required.' \
            'Closing the GUI leaves tasks running. Runtime shutdown is an explicit action.' \
            '  run exec "your prompt"     One-shot task' \
            '  run serve                  Start the local runtime (HTTP + SSE)' \
            '  run status                 Show runtime status' \
            > "$dir/README.txt"

          cd "$dir"
          zip -r "../mimicry-claw-${TARGET}.zip" .
          cd ..
          ls -lh "mimicry-claw-${TARGET}.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mimicry-claw-${{ matrix.target }}
          path: mimicry-claw-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish desktop preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Write release notes
        run: |
          cat > release_notes.md << 'NOTES_EOF'
          ## Mimicry Claw Desktop Preview

          Avalonia desktop client sharing the Kotlin runtime. Self-contained .NET frontend.
          Includes sessions/transcript, task status, structured tool activity and permission approval.
          Closing/quitting the GUI leaves the runtime running. Runtime shutdown is a separate confirmed action.
          The Terminal panel is a real command-output runner, not a PTY emulator.
          Skills/MCP/subagent/plan execution remain unintegrated; unimplemented tools remain explicitly marked.
          ARM64 packages are cross-published; native window-manager behaviour still requires manual device testing.

          ### Requirements
          - **Java 21 JDK** on every platform
          - Download: https://adoptium.net/ (or `brew install openjdk@21` on macOS)

          ### Usage
          Extract the ZIP for your platform and run `run.bat` (Windows) or `./run.sh` (Linux/macOS).

          ```
          run --help                 Show all commands
          run tui                    Interactive TUI (Normal / Full Screen)
          run gui                    Open GUI, auto-start or attach to local runtime
          run exec "your prompt"     One-shot task
          run serve                  Start the local runtime (HTTP + SSE)
          run status                 Show runtime status
          ```

          ### API configuration
          Set the provider API key before running, for example:
          ```
          export ANTHROPIC_API_KEY="sk-ant-..."
          export OPENAI_API_KEY="sk-..."
          ```

          ### Artifacts
          - `mimicry-claw-windows-x64.zip`
          - `mimicry-claw-windows-arm64.zip`
          - `mimicry-claw-linux-x64.zip`
          - `mimicry-claw-linux-arm64.zip`
          - `mimicry-claw-macos-x64.zip`
          - `mimicry-claw-macos-arm64.zip`
          NOTES_EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="desktop-preview-${GITHUB_SHA:0:7}"
          assets=(artifacts/mimicry-claw-*/mimicry-claw-*.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release_notes.md
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Mimicry Claw Desktop Preview (${GITHUB_SHA:0:7})" \
              --notes-file release_notes.md --prerelease "${assets[@]}"
          fi
